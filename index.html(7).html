  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-card: #121824;
      --bg-card-hover: #182232;
      --bg-input: #1a2230;
      --bg-elevated: #1e2838;
      --border-subtle: #243044;
      --border-bright: #3b4d6a;
      --border-focus: #00f0ff;
      --text-primary: #f0f6fc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --cyan-primary: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.35);
      --blue-primary: #3b82f6;
      --mint-accent: #10b981;
      --amber-warning: #f59e0b;
      --rose-danger: #f43f5e;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, Menlo, Consolas, monospace;
      --touch-target-min: 48px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font-main);
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 50%), radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }
    h1, h2, h3, h4 { color: var(--text-primary); font-weight: 700; line-height: 1.25; }
    p { color: var(--text-secondary); }
    a { color: var(--cyan-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre { font-family: var(--font-mono); }
    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 1rem; }
    .site-header { position: sticky; top: 0; z-index: 50; background: rgba(10, 14, 23, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); padding: 0.75rem 0; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .brand { display: flex; align-items: center; gap: 0.65rem; font-weight: 700; font-size: 1.15rem; color: #fff; cursor: pointer; }
    .header-actions { display: flex; align-items: center; gap: 0.6rem; }
    .user-profile-badge { display: flex; align-items: center; gap: 0.5rem; background: var(--bg-elevated); border: 1px solid var(--border-subtle); padding: 0.25rem 0.65rem 0.25rem 0.35rem; border-radius: var(--radius-full); }
    .user-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .user-name-text { font-size: 0.85rem; font-weight: 600; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-nav-tabs { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.5rem 0; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-subtle); scrollbar-width: none; }
    .app-nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.55rem 1rem; border-radius: var(--radius-full); background: transparent; border: 1px solid transparent; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .nav-tab-btn:hover { color: var(--text-primary); background: var(--bg-card); }
    .nav-tab-btn.active { color: var(--cyan-primary); background: rgba(0, 240, 255, 0.1); border-color: rgba(0, 240, 255, 0.3); }
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.25rem; transition: 0.2s; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .card-title { font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-weight: 600; font-size: 0.95rem; min-height: var(--touch-target-min); padding: 0.7rem 1.25rem; border-radius: var(--radius-md); border: none; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .btn-sm { min-height: 36px; padding: 0.4rem 0.85rem; font-size: 0.85rem; border-radius: var(--radius-sm); }
    .btn-primary { background: linear-gradient(135deg, #00f0ff, #0099ff); color: #050d1a; box-shadow: 0 4px 14px var(--cyan-glow); }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-subtle); }
    .btn-secondary:hover { background: var(--border-bright); }
    .btn-danger { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }
    .btn-danger:hover { background: var(--rose-danger); color: #fff; }
    .btn-warning { background: rgba(245, 158, 11, 0.15); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.3); }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.6rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; }
    .badge-cyan { background: rgba(0, 240, 255, 0.12); color: var(--cyan-primary); border: 1px solid rgba(0, 240, 255, 0.25); }
